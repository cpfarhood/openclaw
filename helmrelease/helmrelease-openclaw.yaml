---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openclaw
  namespace: openclaw
spec:
  chart:
    spec:
      chart: openclaw
      version: "1.3.x"
      sourceRef:
        kind: HelmRepository
        name: openclaw
        namespace: flux-system
  interval: 1h
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  releaseName: openclaw
  values:
    app-template:
      openclawVersion: "2026.2.9"
      chromiumVersion: "124"
      # merge preserves runtime changes, overwrite for strict GitOps
      configMode: merge

      controllers:
        main:
          replicas: 1 # OpenClaw is NOT horizontally scalable
          strategy: Recreate
          containers:
            main:
              image:
                repository: ghcr.io/openclaw/openclaw
                pullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: openclaw-env-secret
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  cpu: 2000m
                  memory: 2Gi

      defaultPodOptions:
        securityContext:
          seccompProfile:
            type: RuntimeDefault

      configMaps:
        config:
          enabled: true
          data:
            openclaw.json: |
              {
                "gateway": {
                  "port": 18789,
                  "mode": "local",
                  // Update with your Cilium/Traefik LoadBalancer IPs
                  "trustedProxies": ["172.18.0.0/20"]
                },
                "browser": {
                  "enabled": true,
                  "defaultProfile": "default",
                  "profiles": {
                    "default": {
                      "cdpUrl": "http://localhost:9222",
                      "color": "#4285F4"
                    }
                  }
                },
                "agents": {
                  "defaults": {
                    "workspace": "/home/node/.openclaw/workspace",
                    "model": {
                      "primary": "google/gemini-2.0-flash-exp"
                    },
                    "userTimezone": "America/Detroit",
                    "timeoutSeconds": 600,
                    "maxConcurrent": 1
                  },
                  "list": [
                    {
                      "id": "main",
                      "default": true,
                      "identity": {
                        "name": "OpenClaw",
                        "emoji": "🦞"
                      }
                    }
                  ]
                },
                "session": {
                  "scope": "per-sender",
                  "store": "/home/node/.openclaw/sessions",
                  "reset": {
                    "mode": "idle",
                    "idleMinutes": 60
                  }
                },
                "logging": {
                  "level": "info",
                  "consoleLevel": "info",
                  "consoleStyle": "compact",
                  "redactSensitive": "tools"
                },
                "tools": {
                  "profile": "full",
                  "web": {
                    "search": {
                      "enabled": false
                    },
                    "fetch": {
                      "enabled": true
                    }
                  }
                }
                // Add channel configuration via openclaw-env-secret
              }

        chromium:
          enabled: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi

      service:
        main:
          ipFamilyPolicy: SingleStack
          ipFamilies:
            - IPv4
          ports:
            http:
              port: 18789

      ingress:
        main:
          enabled: false

      persistence:
        data:
          enabled: true
          type: persistentVolumeClaim
          accessMode: ReadWriteOnce
          size: 5Gi
          storageClass: ceph-block
